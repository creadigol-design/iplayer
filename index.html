<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>iPlayer Artwork Builder — PoC</title>
<script src="https://cdn.jsdelivr.net/npm/ag-psd@24.0.0/dist/bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root {
    --bg: #1c1c1f;
    --panel: #2a2a2e;
    --panel-2: #232327;
    --border: #3a3a40;
    --text: #f5f5f7;
    --muted: #9a9aa0;
    --accent: #ff4081;
    --accent-2: #ffb300;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  body { display: grid; grid-template-columns: 260px 1fr 320px; height: 100vh; overflow: hidden; }
  aside, main { overflow-y: auto; }
  aside { background: var(--panel); border-right: 1px solid var(--border); padding: 16px; }
  aside.right { border-right: none; border-left: 1px solid var(--border); }
  main { background: #111; display: flex; flex-direction: column; }
  .toolbar {
    display: flex; gap: 8px; padding: 12px 16px;
    background: var(--panel-2); border-bottom: 1px solid var(--border);
    align-items: center; flex-wrap: wrap;
  }
  .stage-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: auto; }
  .stage {
    position: relative; background: #000;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    transform-origin: top left;
  }
  .stage canvas.bg { position: absolute; top: 0; left: 0; pointer-events: none; }
  .layer {
    position: absolute; cursor: move;
    border: 1px dashed transparent;
    user-select: none; touch-action: none;
  }
  .layer.selected { border-color: var(--accent); }
  .layer img { width: 100%; height: 100%; pointer-events: none; display: block; }
  .handle {
    position: absolute; width: 12px; height: 12px;
    background: var(--accent); border: 2px solid #fff; border-radius: 50%;
  }
  .handle.tl { top: -7px; left: -7px; cursor: nwse-resize; }
  .handle.tr { top: -7px; right: -7px; cursor: nesw-resize; }
  .handle.bl { bottom: -7px; left: -7px; cursor: nesw-resize; }
  .handle.br { bottom: -7px; right: -7px; cursor: nwse-resize; }
  .handle.rot { top: -28px; left: 50%; transform: translateX(-50%); background: var(--accent-2); cursor: grab; }
  .safe-zone {
    position: absolute; border: 2px dashed rgba(0, 229, 255, 0.6);
    pointer-events: none; box-sizing: border-box;
  }
  .safe-zone .label {
    position: absolute; top: -22px; left: 0;
    background: rgba(0, 229, 255, 0.85); color: #000;
    font-size: 11px; padding: 2px 6px; border-radius: 3px;
    font-family: monospace; white-space: nowrap;
  }

  h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; }
  .layout-list { display: flex; flex-direction: column; gap: 4px; }
  .layout-btn {
    text-align: left; padding: 8px 10px; border-radius: 6px;
    background: var(--panel-2); color: var(--text); border: 1px solid transparent;
    cursor: pointer; font-size: 12px;
  }
  .layout-btn:hover { border-color: var(--border); }
  .layout-btn.active { background: var(--accent); color: #fff; }

  .layer-list { display: flex; flex-direction: column; gap: 6px; }
  .layer-row {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px;
  }
  .layer-row.selected { border-color: var(--accent); }
  .layer-row .row-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .layer-row .name { font-size: 12px; font-weight: 600; cursor: pointer; flex: 1; }
  .layer-row .actions { display: flex; gap: 4px; }
  .icon-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-size: 11px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: var(--border); }

  label.upload {
    display: block; margin-top: 6px;
    padding: 6px 8px; font-size: 11px;
    background: #3a3a40; border-radius: 4px; cursor: pointer; text-align: center;
  }
  label.upload input { display: none; }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .control { display: flex; flex-direction: column; gap: 2px; }
  .control label { font-size: 10px; color: var(--muted); }
  .control input { background: #18181b; color: var(--text); border: 1px solid var(--border); padding: 4px 6px; border-radius: 4px; font-size: 11px; }

  .btn {
    padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px;
    background: var(--accent); color: #fff;
  }
  .btn.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  .btn.gold { background: var(--accent-2); color: #1c1c1f; font-weight: 600; }
  .pill { font-size: 11px; color: var(--muted); padding: 4px 8px; background: var(--panel); border-radius: 999px; }
  .spacer { flex: 1; }
  .empty-hint { color: var(--muted); font-size: 11px; padding: 12px; text-align: center; }
</style>
</head>
<body>

<aside class="left">
  <h3>Strand</h3>
  <select id="strandPicker" style="width: 100%; padding: 8px; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 12px;"></select>
  <div style="display: flex; gap: 4px; margin-top: 6px;">
    <button class="btn secondary" id="newStrand" style="flex: 1; font-size: 11px; padding: 6px;">+ New strand</button>
    <button class="btn secondary" id="renameStrand" style="flex: 0 0 auto; font-size: 11px; padding: 6px 10px;">Rename</button>
    <button class="btn secondary" id="deleteStrand" style="flex: 0 0 auto; font-size: 11px; padding: 6px 10px;">Delete</button>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
    <span style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em;">Brand palette</span>
    <button class="btn secondary" id="paletteEditToggle" style="font-size: 10px; padding: 3px 8px;">Edit</button>
  </div>
  <div id="brandPalette" style="display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; align-items: center;"></div>

  <h3 style="margin-top: 20px;">Layouts</h3>
  <div class="layout-list" id="layoutList"></div>

  <h3 style="margin-top: 20px;">About</h3>
  <p style="font-size: 11px; color: var(--muted); line-height: 1.5;">
    PoC artwork builder. Pick a strand, pick a layout, compose with image + text layers. Drag to position, corners to resize.
    Auto-saves to your browser. Export per-layout or bulk as JPEG / PSD.
  </p>
</aside>

<main>
  <div class="toolbar">
    <span class="pill" id="layoutName">—</span>
    <span class="pill" id="layoutDims">—</span>
    <span class="spacer"></span>
    <button class="btn secondary" id="zoomFit">Fit</button>
    <button class="btn secondary" id="zoomActual">100%</button>
    <button class="btn secondary" id="toggleZones">Safe zones</button>
    <button class="btn secondary" id="saveProject">Save .json</button>
    <label class="btn secondary" for="loadProjectInput" style="cursor: pointer;">Load .json</label>
    <input type="file" id="loadProjectInput" accept="application/json" style="display:none;">
    <button class="btn secondary" id="exportJpg">Export JPEG</button>
    <button class="btn secondary" id="exportPsd">Export PSD</button>
    <button class="btn" id="exportAllJpg">All JPEG (zip)</button>
    <button class="btn gold" id="exportAllPsd">All PSD (zip)</button>
  </div>
  <div class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage"></div>
  </div>
</main>

<aside class="right">
  <h3>Layers</h3>
  <div class="layer-list" id="layerList"></div>
  <h3 style="margin-top: 20px;">Selected layer</h3>
  <div id="layerControls"><div class="empty-hint">Select a layer to edit position/size</div></div>
</aside>

<script>
/* ============================================================
   Strand library — every sport / tournament / brand is a strand.
   Each strand carries its own brand palette and (in localStorage)
   its own per-layout project state. Layouts themselves are shared
   across strands because they reflect iPlayer platform formats.
   New strands can be added via the UI ("+ New strand") and persist
   in localStorage. Defaults below are starter examples — extend
   with real brand specs as they arrive.
   ============================================================ */
const DEFAULT_STRANDS = [
  { id: 'wrwc-2025',  sport: 'Rugby',     name: "Women's Rugby World Cup 2025", palette: ['#FFB300','#FF4081','#FF6B35','#FFFFFF'], brandAssets: {} },
  { id: 'six-nations',sport: 'Rugby',     name: 'Six Nations',                  palette: ['#003366','#FF0000','#FFFFFF','#000000'], brandAssets: {} },
  { id: 'wimbledon',  sport: 'Tennis',    name: 'Wimbledon',                    palette: ['#006633','#552583','#FFFFFF','#FFD700'], brandAssets: {} },
  { id: 'fa-cup',     sport: 'Football',  name: 'FA Cup',                       palette: ['#D2122E','#FFFFFF','#1B1B1B','#FFD700'], brandAssets: {} },
  { id: 'mtod',       sport: 'Football',  name: 'Match of the Day',             palette: ['#FFCC00','#000000','#1B1B1B','#FFFFFF'], brandAssets: {} },
  { id: 'olympics',   sport: 'Olympics',  name: 'Olympic Games',                palette: ['#0085C7','#F4C300','#000000','#009F3D','#DF0024'], brandAssets: {} },
  { id: 'open',       sport: 'Golf',      name: 'The Open Championship',        palette: ['#0A2E5D','#FFD700','#FFFFFF','#9CC4E4'], brandAssets: {} },
  { id: 'tdf',        sport: 'Cycling',   name: 'Tour de France',               palette: ['#FFEB3B','#000000','#DF0024','#FFFFFF'], brandAssets: {} },
  { id: 'hundred',    sport: 'Cricket',   name: 'The Hundred',                  palette: ['#FF1744','#00BFA5','#FFFFFF','#000000'], brandAssets: {} },
  { id: 'snooker',    sport: 'Snooker',   name: 'World Snooker',                palette: ['#0E5C2F','#FFFFFF','#FFD700','#9C2424'], brandAssets: {} },
  { id: 'athletics',  sport: 'Athletics', name: 'World Athletics',              palette: ['#0033A0','#FFC107','#FFFFFF','#E50046'], brandAssets: {} },
  { id: 'darts',      sport: 'Darts',     name: 'World Darts',                  palette: ['#0F2F5F','#E50046','#FFFFFF','#FFD700'], brandAssets: {} },
];

const STRAND_LS_KEY = 'iplayer-poc-strands-v1';
const STATE_LS_KEY  = (strandId) => `iplayer-poc-state-v1::${strandId}`;
const CURRENT_STRAND_LS_KEY = 'iplayer-poc-current-strand-v1';

function loadStrandsFromStorage() {
  try {
    const raw = localStorage.getItem(STRAND_LS_KEY);
    if (raw) {
      const list = JSON.parse(raw);
      list.forEach(s => { if (!s.brandAssets) s.brandAssets = {}; });
      return list;
    }
  } catch {}
  return DEFAULT_STRANDS.map(s => ({ ...s, brandAssets: { ...(s.brandAssets || {}) } }));
}
function saveStrandsToStorage() {
  localStorage.setItem(STRAND_LS_KEY, JSON.stringify(STRANDS));
}
const STRANDS = loadStrandsFromStorage();
let currentStrandId = localStorage.getItem(CURRENT_STRAND_LS_KEY) || STRANDS[0].id;

/* ============================================================
   Layout definitions — iPlayer platform artwork formats
   ============================================================ */
/* Safe zones are expressed as proportions [x%, y%, w%, h%] of the canvas.
   They are guides only — never exported. */
const LAYOUTS = [
  { id: 'brand-9x16',     name: 'BRAND - 9x16 Portrait',          w: 1080, h: 1920,
    zones: [ { label: 'Talent safe',   x: 0.06, y: 0.18, w: 0.88, h: 0.64 },
             { label: 'Logo lockup',   x: 0.30, y: 0.40, w: 0.40, h: 0.20 } ] },
  { id: 'brand-logo',     name: 'BRAND - 16x9 Logo Image',         w: 1920, h: 1080,
    zones: [ { label: 'Logo lockup',   x: 0.35, y: 0.20, w: 0.30, h: 0.60 } ] },
  { id: 'brand-land',     name: 'BRAND - 16x9 Landscape',          w: 1920, h: 1080,
    zones: [ { label: 'Talent safe',   x: 0.04, y: 0.10, w: 0.92, h: 0.80 },
             { label: 'Logo lockup',   x: 0.70, y: 0.30, w: 0.25, h: 0.40 } ] },
  { id: 'h2h',            name: '16x9 Head to Head + Logo',        w: 1920, h: 1080,
    zones: [ { label: 'Team A',        x: 0.05, y: 0.10, w: 0.40, h: 0.80 },
             { label: 'Team B',        x: 0.55, y: 0.10, w: 0.40, h: 0.80 },
             { label: 'Centre logo',   x: 0.42, y: 0.30, w: 0.16, h: 0.40 } ] },
  { id: 'ep-primary',     name: '16x9 Episode - PRIMARY IMAGE',    w: 1920, h: 1080,
    zones: [ { label: 'iPlayer UI',    x: 0.00, y: 0.00, w: 0.40, h: 1.00 },
             { label: 'Talent safe',   x: 0.45, y: 0.10, w: 0.50, h: 0.80 } ] },
  { id: 'imm-live',       name: 'Immersive Hero - Live Match',     w: 1920, h: 1080,
    zones: [ { label: 'Title panel',   x: 0.02, y: 0.10, w: 0.32, h: 0.80 },
             { label: 'Talent safe',   x: 0.40, y: 0.05, w: 0.55, h: 0.90 } ] },
  { id: 'deeplink',       name: '16x9 Deeplink (Third Parties)',   w: 1920, h: 1080,
    zones: [ { label: 'Talent safe',   x: 0.10, y: 0.10, w: 0.80, h: 0.65 },
             { label: 'iPlayer logo',  x: 0.05, y: 0.78, w: 0.20, h: 0.15 } ] },
  { id: 'highlights',     name: '16x9 Highlights',                 w: 1920, h: 1080,
    zones: [ { label: 'Talent safe',   x: 0.05, y: 0.10, w: 0.65, h: 0.80 },
             { label: 'Team badges',   x: 0.72, y: 0.30, w: 0.25, h: 0.40 } ] },
  { id: 'imm-highlights', name: 'Immersive Hero - Highlights',     w: 1920, h: 1080,
    zones: [ { label: 'Title panel',   x: 0.02, y: 0.10, w: 0.32, h: 0.80 },
             { label: 'Talent safe',   x: 0.40, y: 0.05, w: 0.55, h: 0.90 } ] },
];

/* ============================================================
   Layer model. Each layout instance has 5 layers in z-order:
   background -> talent -> overlay1 -> overlay2 -> overlay3
   ============================================================ */
const LAYER_NAMES = [
  'Background',
  'Talent (transparent)',
  'Overlay 1', 'Overlay 2', 'Overlay 3', 'Overlay 4', 'Overlay 5',
];
function newLayer(name) {
  return {
    name, kind: 'image',
    assetId: null,
    x: 0, y: 0, w: 0, h: 0, rotation: 0,
    opacity: 1, visible: true, touched: false,
    // text-only fields
    text: '', fontSize: 96, fontFamily: 'Inter, Arial, sans-serif',
    fontWeight: 700, color: '#ffffff', align: 'left', lineHeight: 1.1,
  };
}
function freshLayoutState(layout) {
  return {
    layoutId: layout.id, w: layout.w, h: layout.h,
    layers: LAYER_NAMES.map(newLayer),
    zOrder: LAYER_NAMES.map((_, i) => i), // bottom -> top
    selectedIdx: 0,
  };
}

/* Proportional sync: when the user moves/resizes a layer on the active layout,
   push the same proportional position to every OTHER layout whose matching
   layer hasn't been manually touched yet. */
function syncLayerProportionally(srcLayoutId, layerIdx) {
  const src = states[srcLayoutId];
  const L = src.layers[layerIdx];
  if (!L.assetId) return;
  const px = L.x / src.w, py = L.y / src.h;
  const pw = L.w / src.w, ph = L.h / src.h;
  Object.values(states).forEach(other => {
    if (other.layoutId === srcLayoutId) return;
    const oL = other.layers[layerIdx];
    if (!oL.assetId || oL.touched) return;
    oL.x = px * other.w;
    oL.y = py * other.h;
    oL.w = pw * other.w;
    oL.h = ph * other.h;
    oL.rotation = L.rotation;
  });
}

/* Shared asset library — every uploaded image stored once, referenced by id.
   That way switching layouts (or running "Export All") reuses the same files. */
const assets = {}; // id -> { id, src, img, width, height }
let assetSeq = 1;
function addAsset(src, img) {
  const id = 'a' + (assetSeq++);
  assets[id] = { id, src, img, width: img.width, height: img.height };
  return id;
}

/* Sticky brand assets per strand: a pinned slot's image becomes the
   default for that slot on every layout for this strand. */
function pinSlotAsBrandAsset(slotIdx) {
  const L = doc.layers[slotIdx];
  if (L.kind !== 'image' || !L.assetId) {
    alert('Pin only works on image layers. Upload an image first.');
    return;
  }
  const a = assets[L.assetId];
  const strand = STRANDS.find(s => s.id === currentStrandId); if (!strand) return;
  strand.brandAssets[slotIdx] = { src: a.src, width: a.width, height: a.height };
  saveStrandsToStorage();
  // Apply to every other layout in this strand whose same slot is empty
  Object.values(states).forEach(other => {
    if (other.layoutId === doc.layoutId) return;
    const oL = other.layers[slotIdx];
    if (!oL.assetId) {
      oL.kind = 'image'; oL.assetId = L.assetId; oL.text = '';
      autoPlaceLayer(other, slotIdx);
    }
  });
  renderLayerList(); renderControls();
}

function unpinBrandAsset(slotIdx) {
  const strand = STRANDS.find(s => s.id === currentStrandId); if (!strand) return;
  delete strand.brandAssets[slotIdx];
  saveStrandsToStorage();
  renderLayerList(); renderControls();
}

function applyBrandAssetsToEmptySlots() {
  const strand = STRANDS.find(s => s.id === currentStrandId); if (!strand) return;
  Object.entries(strand.brandAssets).forEach(([slotIdxStr, ba]) => {
    const slotIdx = parseInt(slotIdxStr);
    // Ensure an asset exists for the brand asset src
    let assetId = Object.values(assets).find(a => a.src === ba.src)?.id;
    if (!assetId) {
      const img = new Image(); img.src = ba.src;
      assetId = addAsset(ba.src, img);
      // width/height come from stored metadata to keep autoPlace deterministic
      assets[assetId].width = ba.width;
      assets[assetId].height = ba.height;
    }
    Object.values(states).forEach(state => {
      const L = state.layers[slotIdx];
      if (!L.assetId && !L.text) {
        L.kind = 'image'; L.assetId = assetId;
        autoPlaceLayer(state, slotIdx);
      }
    });
  });
}

let currentLayout = LAYOUTS[0];
let states = {}; // layoutId -> layoutState (for the active strand)
let doc;
let zoom = 1;

function freshStatesForStrand() {
  const s = {};
  LAYOUTS.forEach(l => { s[l.id] = freshLayoutState(l); });
  return s;
}

function loadStrandState(strandId) {
  // Reset asset library — assets are scoped per strand
  Object.keys(assets).forEach(k => delete assets[k]);
  assetSeq = 1;

  let restored = false;
  try {
    const raw = localStorage.getItem(STATE_LS_KEY(strandId));
    if (raw) {
      const data = JSON.parse(raw);
      assetSeq = data.assetSeq || 1;
      Object.values(data.assets || {}).forEach(a => {
        const img = new Image();
        img.src = a.src;
        // Use the data URL — img.complete may be false until decoded; preview will catch up on next render
        assets[a.id] = { id: a.id, src: a.src, img, width: a.width, height: a.height };
      });
      states = {};
      LAYOUTS.forEach(l => {
        states[l.id] = data.states?.[l.id] || freshLayoutState(l);
      });
      restored = true;
    }
  } catch (e) {
    console.warn('localStorage load failed', e);
  }
  if (!restored) states = freshStatesForStrand();

  currentLayout = LAYOUTS[0];
  doc = states[currentLayout.id];
  currentStrandId = strandId;
  localStorage.setItem(CURRENT_STRAND_LS_KEY, strandId);
}

let autosaveTimer = null;
function scheduleAutosave() {
  if (autosaveTimer) return;
  autosaveTimer = setTimeout(() => {
    autosaveTimer = null;
    try {
      const assetOut = {};
      Object.values(assets).forEach(a => { assetOut[a.id] = { id: a.id, src: a.src, width: a.width, height: a.height }; });
      const payload = {
        version: 1, assetSeq, assets: assetOut,
        states: Object.fromEntries(Object.entries(states).map(([k, s]) => [k, {
          layoutId: s.layoutId, w: s.w, h: s.h, layers: s.layers, zOrder: s.zOrder, selectedIdx: s.selectedIdx,
        }])),
      };
      localStorage.setItem(STATE_LS_KEY(currentStrandId), JSON.stringify(payload));
    } catch (e) {
      // localStorage quota exceeded — silent so it doesn't spam the user
      console.warn('autosave failed', e);
    }
  }, 600);
}

/* ============================================================
   UI: strand picker + layout sidebar
   ============================================================ */
const strandPickerEl = document.getElementById('strandPicker');
const brandPaletteEl = document.getElementById('brandPalette');
const layoutListEl   = document.getElementById('layoutList');

function renderStrandPicker() {
  strandPickerEl.innerHTML = '';
  // Group by sport
  const bySport = {};
  STRANDS.forEach(s => { (bySport[s.sport] = bySport[s.sport] || []).push(s); });
  Object.entries(bySport).sort(([a],[b]) => a.localeCompare(b)).forEach(([sport, list]) => {
    const og = document.createElement('optgroup'); og.label = sport;
    list.forEach(s => {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.name; if (s.id === currentStrandId) o.selected = true;
      og.appendChild(o);
    });
    strandPickerEl.appendChild(og);
  });
}

let paletteEditMode = false;

function renderBrandPalette() {
  brandPaletteEl.innerHTML = '';
  const strand = STRANDS.find(s => s.id === currentStrandId);
  if (!strand) return;
  strand.palette.forEach((col, i) => {
    if (paletteEditMode) {
      const wrap = document.createElement('span');
      wrap.style.cssText = 'position: relative; display: inline-block;';
      const picker = document.createElement('input');
      picker.type = 'color';
      picker.value = normalizeHex(col);
      picker.title = 'Change colour';
      picker.style.cssText = 'width: 28px; height: 28px; padding: 0; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; background: none;';
      picker.oninput = () => { strand.palette[i] = picker.value.toUpperCase(); saveStrandsToStorage(); };
      picker.onchange = () => { strand.palette[i] = picker.value.toUpperCase(); saveStrandsToStorage(); renderBrandPalette(); };
      const rm = document.createElement('button');
      rm.textContent = '×';
      rm.title = 'Remove colour';
      rm.style.cssText = 'position: absolute; top: -6px; right: -6px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); cursor: pointer; font-size: 10px; line-height: 1; padding: 0;';
      rm.onclick = () => { strand.palette.splice(i, 1); saveStrandsToStorage(); renderBrandPalette(); };
      wrap.appendChild(picker); wrap.appendChild(rm);
      brandPaletteEl.appendChild(wrap);
    } else {
      const sw = document.createElement('button');
      sw.title = `${col} — click to apply to selected text layer`;
      sw.style.width = '24px'; sw.style.height = '24px';
      sw.style.background = col;
      sw.style.border = '1px solid var(--border)';
      sw.style.borderRadius = '4px'; sw.style.cursor = 'pointer';
      sw.onclick = () => {
        const L = doc.layers[doc.selectedIdx];
        if (L && L.kind === 'text') { L.color = col; renderStage(); renderControls(); scheduleAutosave(); }
      };
      brandPaletteEl.appendChild(sw);
    }
  });
  if (paletteEditMode) {
    const add = document.createElement('button');
    add.textContent = '+';
    add.title = 'Add colour';
    add.style.cssText = 'width: 28px; height: 28px; border-radius: 4px; background: var(--panel-2); color: var(--text); border: 1px dashed var(--border); cursor: pointer; font-size: 14px; line-height: 1;';
    add.onclick = () => {
      strand.palette.push('#FFFFFF');
      saveStrandsToStorage(); renderBrandPalette();
    };
    brandPaletteEl.appendChild(add);
  }
}

function normalizeHex(c) {
  if (typeof c !== 'string') return '#000000';
  const m = c.match(/^#([0-9A-Fa-f]{3,8})$/);
  if (!m) return '#000000';
  let h = m[1];
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  if (h.length === 8) h = h.slice(0, 6);
  return '#' + h.toUpperCase();
}

document.getElementById('paletteEditToggle').onclick = (e) => {

document.getElementById('newStrand').onclick = () => {

document.getElementById('deleteStrand').onclick = () => {

  if (!confirm(`Delete strand "${s.name}" and all its saved work?`)) return;
  localStorage.removeItem(STATE_LS_KEY(s.id));

function switchLayout(id) {
  const layout = LAYOUTS.find(l => l.id === id);
  if (!layout) return;
  currentLayout = layout;
  doc = states[layout.id];

  // For any layer that has an asset on the previous layout but not this one,
  // copy the assetId across with an auto-placement. Lets a user upload once and see it everywhere.
  Object.values(states).forEach(otherState => {
    if (otherState === doc) return;
    otherState.layers.forEach((srcL, i) => {
      const dstL = doc.layers[i];
      if (srcL.assetId && !dstL.assetId) {
        dstL.assetId = srcL.assetId;
        autoPlaceLayer(doc, i);
      }
    });
  });

  document.querySelectorAll('.layout-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  buildStage();
}

function autoPlaceLayer(state, idx) {
  const L = state.layers[idx];
  if (!L.assetId) return;
  const a = assets[L.assetId];
  if (!a) return;
  if (idx === 0) {
    // background -> fill
    const s = Math.max(state.w / a.width, state.h / a.height);
    L.w = a.width * s; L.h = a.height * s;
    L.x = (state.w - L.w) / 2; L.y = (state.h - L.h) / 2;
  } else {
    // others -> fit at 60%
    const s = Math.min(state.w / a.width, state.h / a.height) * 0.6;
    L.w = a.width * s; L.h = a.height * s;
    L.x = (state.w - L.w) / 2; L.y = (state.h - L.h) / 2;
  }
}

/* ============================================================
   Stage build / render
   ============================================================ */
const stageEl = document.getElementById('stage');
const stageWrap = document.getElementById('stageWrap');

function buildStage() {
  stageEl.innerHTML = '';
  stageEl.style.width = doc.w + 'px';
  stageEl.style.height = doc.h + 'px';
  document.getElementById('layoutName').textContent = currentLayout.name;
  document.getElementById('layoutDims').textContent = `${doc.w} × ${doc.h}`;
  fitZoom();
  renderStage();
  renderLayerList();
  renderControls();
}

function fitZoom() {
  const padding = 48;
  const availW = stageWrap.clientWidth - padding;
  const availH = stageWrap.clientHeight - padding;
  zoom = Math.min(availW / doc.w, availH / doc.h, 1);
  stageEl.style.transform = `scale(${zoom})`;
  // size the wrap area to accommodate scaled stage
  stageEl.style.marginRight = (doc.w * zoom - doc.w) + 'px';
  stageEl.style.marginBottom = (doc.h * zoom - doc.h) + 'px';
}
function setZoom(z) {
  zoom = z;
  stageEl.style.transform = `scale(${zoom})`;
  stageEl.style.marginRight = (doc.w * zoom - doc.w) + 'px';
  stageEl.style.marginBottom = (doc.h * zoom - doc.h) + 'px';
}

let showSafeZones = false;

function renderStage() {
  scheduleAutosave();
  stageEl.innerHTML = '';
  if (showSafeZones && currentLayout.zones) {
    currentLayout.zones.forEach(z => {
      const zEl = document.createElement('div');
      zEl.className = 'safe-zone';
      zEl.style.left = (z.x * doc.w) + 'px';
      zEl.style.top = (z.y * doc.h) + 'px';
      zEl.style.width = (z.w * doc.w) + 'px';
      zEl.style.height = (z.h * doc.h) + 'px';
      zEl.style.zIndex = 10000;
      const lab = document.createElement('div');
      lab.className = 'label';
      lab.textContent = z.label;
      zEl.appendChild(lab);
      stageEl.appendChild(zEl);
    });
  }
  doc.zOrder.forEach((idx, zPos) => {
    const L = doc.layers[idx];
    if (!L.visible) return;
    const hasContent = (L.kind === 'image' && L.assetId && assets[L.assetId]) ||
                       (L.kind === 'text' && L.text);
    if (!hasContent) return;

    const el = document.createElement('div');
    el.className = 'layer' + (idx === doc.selectedIdx ? ' selected' : '');
    el.style.left = L.x + 'px';
    el.style.top = L.y + 'px';
    el.style.width = L.w + 'px';
    el.style.height = L.h + 'px';
    el.style.transform = `rotate(${L.rotation}deg)`;
    el.style.zIndex = zPos + 1;
    el.style.opacity = L.opacity;
    el.dataset.idx = idx;

    if (L.kind === 'image') {
      const im = document.createElement('img');
      im.src = assets[L.assetId].src;
      el.appendChild(im);
    } else {
      const t = document.createElement('div');
      t.style.width = '100%'; t.style.height = '100%';
      t.style.color = L.color;
      t.style.fontFamily = L.fontFamily;
      t.style.fontWeight = L.fontWeight;
      t.style.fontSize = L.fontSize + 'px';
      t.style.lineHeight = L.lineHeight;
      t.style.textAlign = L.align;
      t.style.whiteSpace = 'pre-wrap';
      t.style.wordBreak = 'break-word';
      t.style.display = 'flex';
      t.style.alignItems = 'flex-start';
      t.style.justifyContent = L.align === 'center' ? 'center' : (L.align === 'right' ? 'flex-end' : 'flex-start');
      t.textContent = L.text;
      el.appendChild(t);
    }

    if (idx === doc.selectedIdx) {
      ['tl','tr','bl','br'].forEach(pos => {
        const h = document.createElement('div');
        h.className = 'handle ' + pos;
        h.dataset.handle = pos;
        el.appendChild(h);
      });
    }
    attachDrag(el, idx);
    stageEl.appendChild(el);
  });
}

/* ============================================================
   Drag / resize
   ============================================================ */
const SNAP_THRESHOLD_PX = 8;

function snapValue(target, candidates) {
  const tol = SNAP_THRESHOLD_PX / zoom;
  for (const c of candidates) {
    if (Math.abs(target - c) < tol) return { value: c, hit: true };
  }
  return { value: target, hit: false };
}

function attachDrag(el, idx) {
  el.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    doc.selectedIdx = idx; renderStage(); renderLayerList(); renderControls();
    const L = doc.layers[idx];
    const handle = e.target.dataset && e.target.dataset.handle;
    const startX = e.clientX, startY = e.clientY;
    const start = { x: L.x, y: L.y, w: L.w, h: L.h };
    const aspect = start.w / start.h;
    el.setPointerCapture(e.pointerId);

    const xAnchors = [0, doc.w / 2, doc.w];
    const yAnchors = [0, doc.h / 2, doc.h];

    function move(ev) {
      const dx = (ev.clientX - startX) / zoom;
      const dy = (ev.clientY - startY) / zoom;
      clearSnapGuides();
      if (!handle) {
        // Snap: left edge, right edge, center X
        let nx = start.x + dx, ny = start.y + dy;
        const leftSnap = snapValue(nx, xAnchors);
        const rightSnap = snapValue(nx + L.w, xAnchors);
        const cxSnap = snapValue(nx + L.w / 2, xAnchors);
        if (leftSnap.hit) { nx = leftSnap.value; drawSnapGuide('v', nx); }
        else if (rightSnap.hit) { nx = rightSnap.value - L.w; drawSnapGuide('v', rightSnap.value); }
        else if (cxSnap.hit) { nx = cxSnap.value - L.w / 2; drawSnapGuide('v', cxSnap.value); }

        const topSnap = snapValue(ny, yAnchors);
        const botSnap = snapValue(ny + L.h, yAnchors);
        const cySnap = snapValue(ny + L.h / 2, yAnchors);
        if (topSnap.hit) { ny = topSnap.value; drawSnapGuide('h', ny); }
        else if (botSnap.hit) { ny = botSnap.value - L.h; drawSnapGuide('h', botSnap.value); }
        else if (cySnap.hit) { ny = cySnap.value - L.h / 2; drawSnapGuide('h', cySnap.value); }

        L.x = nx; L.y = ny;
      } else {
        let nw = start.w, nh = start.h, nx = start.x, ny = start.y;
        if (handle === 'br') { nw = start.w + dx; nh = nw / aspect; }
        if (handle === 'tr') { nw = start.w + dx; nh = nw / aspect; ny = start.y + (start.h - nh); }
        if (handle === 'bl') { nw = start.w - dx; nh = nw / aspect; nx = start.x + (start.w - nw); }
        if (handle === 'tl') { nw = start.w - dx; nh = nw / aspect; nx = start.x + (start.w - nw); ny = start.y + (start.h - nh); }
        if (nw < 20) return;
        L.w = nw; L.h = nh; L.x = nx; L.y = ny;
      }
      L.touched = true;
      syncLayerProportionally(doc.layoutId, idx);
      renderStage(); renderControls();
    }
    function up(ev) {
      clearSnapGuides();
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
    }
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
  });
}

/* Snap guide overlay — drawn directly inside the stage, removed on drag end */
function clearSnapGuides() {
  stageEl.querySelectorAll('.snap-guide').forEach(g => g.remove());
}
function drawSnapGuide(orientation, pos) {
  const g = document.createElement('div');
  g.className = 'snap-guide';
  g.style.position = 'absolute';
  g.style.background = '#00e5ff';
  g.style.zIndex = 9999;
  g.style.pointerEvents = 'none';
  if (orientation === 'v') {
    g.style.left = pos + 'px'; g.style.top = '0'; g.style.width = '1px'; g.style.height = doc.h + 'px';
  } else {
    g.style.top = pos + 'px'; g.style.left = '0'; g.style.height = '1px'; g.style.width = doc.w + 'px';
  }
  stageEl.appendChild(g);
}

/* ============================================================
   Right panel: layer list + controls
   ============================================================ */
const layerListEl = document.getElementById('layerList');
const layerControlsEl = document.getElementById('layerControls');

function renderLayerList() {
  layerListEl.innerHTML = '';
  // Display top-of-list = top z-order, so iterate zOrder back-to-front
  for (let zPos = doc.zOrder.length - 1; zPos >= 0; zPos--) {
    const idx = doc.zOrder[zPos];
    const L = doc.layers[idx];
    const row = document.createElement('div');
    row.className = 'layer-row' + (idx === doc.selectedIdx ? ' selected' : '');

    const head = document.createElement('div');
    head.className = 'row-head';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = (L.kind === 'text' ? '📝 ' : '') + L.name;
    name.onclick = () => { doc.selectedIdx = idx; renderStage(); renderLayerList(); renderControls(); };
    head.appendChild(name);

    const actions = document.createElement('div');
    actions.className = 'actions';

    const upBtn = document.createElement('button');
    upBtn.className = 'icon-btn';
    upBtn.textContent = '▲';
    upBtn.title = 'Move up';
    upBtn.disabled = zPos === doc.zOrder.length - 1;
    upBtn.style.opacity = upBtn.disabled ? 0.3 : 1;
    upBtn.onclick = () => moveZ(zPos, +1);
    actions.appendChild(upBtn);

    const dnBtn = document.createElement('button');
    dnBtn.className = 'icon-btn';
    dnBtn.textContent = '▼';
    dnBtn.title = 'Move down';
    dnBtn.disabled = zPos === 0;
    dnBtn.style.opacity = dnBtn.disabled ? 0.3 : 1;
    dnBtn.onclick = () => moveZ(zPos, -1);
    actions.appendChild(dnBtn);

    const vis = document.createElement('button');
    vis.className = 'icon-btn';
    vis.textContent = L.visible ? '👁' : '◌';
    vis.title = 'Toggle visibility';
    vis.onclick = () => { L.visible = !L.visible; renderStage(); renderLayerList(); };
    actions.appendChild(vis);

    const strand = STRANDS.find(s => s.id === currentStrandId);
    const isPinned = strand && strand.brandAssets && strand.brandAssets[idx];
    const pin = document.createElement('button');
    pin.className = 'icon-btn';
    pin.textContent = isPinned ? '📍' : '📌';
    pin.title = isPinned ? 'Unpin brand asset (will not auto-fill new layouts)' : 'Pin as strand brand asset (auto-fills this slot on every layout)';
    if (isPinned) pin.style.background = 'var(--accent-2)';
    pin.onclick = () => isPinned ? unpinBrandAsset(idx) : pinSlotAsBrandAsset(idx);
    actions.appendChild(pin);

    const del = document.createElement('button');
    del.className = 'icon-btn';
    del.textContent = '×';
    del.title = 'Clear layer';
    del.onclick = () => {
      L.assetId = null; L.text = ''; L.kind = 'image'; L.w = 0; L.h = 0;
      renderStage(); renderLayerList(); renderControls();
    };
    actions.appendChild(del);
    head.appendChild(actions);
    row.appendChild(head);

    const upload = document.createElement('label');
    upload.className = 'upload';
    upload.textContent = (L.kind === 'image' && L.assetId) ? 'Replace image' : 'Upload image';
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = (e) => loadImage(idx, e.target.files[0]);
    upload.appendChild(input);
    row.appendChild(upload);

    const txtBtn = document.createElement('button');
    txtBtn.className = 'icon-btn';
    txtBtn.style.width = '100%';
    txtBtn.style.marginTop = '4px';
    txtBtn.style.padding = '6px';
    txtBtn.style.fontSize = '11px';
    txtBtn.textContent = (L.kind === 'text' && L.text) ? 'Edit text' : 'Use as text layer';
    txtBtn.onclick = () => makeTextLayer(idx);
    row.appendChild(txtBtn);

    layerListEl.appendChild(row);
  }
}

function moveZ(zPos, dir) {
  const ni = zPos + dir;
  if (ni < 0 || ni >= doc.zOrder.length) return;
  const tmp = doc.zOrder[zPos]; doc.zOrder[zPos] = doc.zOrder[ni]; doc.zOrder[ni] = tmp;
  renderStage(); renderLayerList();
}

function makeTextLayer(idx) {
  const L = doc.layers[idx];
  L.kind = 'text';
  L.assetId = null;
  if (!L.text) L.text = 'Title typically 48–60\ncharacters long';
  if (!L.w || !L.h) {
    L.w = doc.w * 0.45; L.h = doc.h * 0.30;
    L.x = doc.w * 0.05; L.y = doc.h * 0.15;
  }
  doc.selectedIdx = idx;
  renderStage(); renderLayerList(); renderControls();
}

function renderControls() {
  const L = doc.layers[doc.selectedIdx];
  if (!L || !hasContent(L)) {
    layerControlsEl.innerHTML = '<div class="empty-hint">Select a layer with content to edit position/size</div>';
    return;
  }
  const a = L.kind === 'image' ? assets[L.assetId] : null;
  layerControlsEl.innerHTML = '';

  // Position / size grid
  const fields = [
    ['X', 'x'], ['Y', 'y'], ['Width', 'w'], ['Height', 'h'], ['Rotation°', 'rotation'],
  ];
  const grid = document.createElement('div');
  grid.className = 'controls';
  fields.forEach(([label, key]) => {
    const wrap = document.createElement('div');
    wrap.className = 'control';
    const lab = document.createElement('label'); lab.textContent = label;
    const inp = document.createElement('input');
    inp.type = 'number'; inp.value = Math.round(L[key]);
    inp.oninput = (e) => {
      const v = parseFloat(e.target.value) || 0;
      L[key] = v; L.touched = true;
      syncLayerProportionally(doc.layoutId, doc.selectedIdx);
      renderStage();
    };
    wrap.appendChild(lab); wrap.appendChild(inp);
    grid.appendChild(wrap);
  });
  layerControlsEl.appendChild(grid);

  // Opacity slider
  const opacityRow = document.createElement('div');
  opacityRow.style.marginTop = '10px';
  const opLab = document.createElement('label');
  opLab.style.fontSize = '10px'; opLab.style.color = 'var(--muted)';
  opLab.textContent = `Opacity ${Math.round(L.opacity * 100)}%`;
  const op = document.createElement('input');
  op.type = 'range'; op.min = '0'; op.max = '1'; op.step = '0.01'; op.value = L.opacity;
  op.style.width = '100%';
  op.oninput = (e) => { L.opacity = parseFloat(e.target.value); opLab.textContent = `Opacity ${Math.round(L.opacity * 100)}%`; renderStage(); };
  opacityRow.appendChild(opLab); opacityRow.appendChild(op);
  layerControlsEl.appendChild(opacityRow);

  if (L.kind === 'text') {
    layerControlsEl.appendChild(textControlsFor(L));
  }

  // Action buttons
  const actions = document.createElement('div');
  actions.style.marginTop = '10px'; actions.style.display = 'flex'; actions.style.gap = '6px'; actions.style.flexWrap = 'wrap';
  if (L.kind === 'image') {
    const fit = document.createElement('button'); fit.className = 'btn secondary'; fit.textContent = 'Fit';
    fit.onclick = () => fitLayer(L); actions.appendChild(fit);
    const fill = document.createElement('button'); fill.className = 'btn secondary'; fill.textContent = 'Fill';
    fill.onclick = () => fillLayer(L); actions.appendChild(fill);
  }
  const center = document.createElement('button'); center.className = 'btn secondary'; center.textContent = 'Center';
  center.onclick = () => { L.x = (doc.w - L.w) / 2; L.y = (doc.h - L.h) / 2; renderStage(); renderControls(); };
  actions.appendChild(center);
  if (a) {
    const reset = document.createElement('button'); reset.className = 'btn secondary'; reset.textContent = 'Reset size';
    reset.onclick = () => { L.w = a.width; L.h = a.height; renderStage(); renderControls(); };
    actions.appendChild(reset);
  }

  const untether = document.createElement('button');
  untether.className = 'btn secondary';
  untether.textContent = L.touched ? 'Re-link to sync' : 'Linked';
  untether.title = L.touched
    ? 'Currently independent — click to re-link to proportional sync'
    : 'Cross-layout sync is active for this layer';
  untether.onclick = () => {
    L.touched = false;
    autoPlaceLayer(doc, doc.selectedIdx);
    renderStage(); renderControls();
  };
  actions.appendChild(untether);

  layerControlsEl.appendChild(actions);
}

function textControlsFor(L) {
  const wrap = document.createElement('div');
  wrap.style.marginTop = '10px';
  wrap.style.display = 'flex'; wrap.style.flexDirection = 'column'; wrap.style.gap = '6px';

  const ta = document.createElement('textarea');
  ta.value = L.text; ta.rows = 3;
  ta.style.width = '100%'; ta.style.background = '#18181b'; ta.style.color = 'var(--text)';
  ta.style.border = '1px solid var(--border)'; ta.style.borderRadius = '4px'; ta.style.padding = '6px';
  ta.style.fontFamily = 'monospace'; ta.style.fontSize = '12px';
  ta.oninput = (e) => { L.text = e.target.value; renderStage(); };
  wrap.appendChild(ta);

  const grid = document.createElement('div');
  grid.style.display = 'grid';
  grid.style.gridTemplateColumns = '1fr 1fr';
  grid.style.gap = '6px';

  function fld(label, type, value, oninput, attrs = {}) {
    const w = document.createElement('div'); w.className = 'control';
    const lab = document.createElement('label'); lab.textContent = label;
    const inp = document.createElement('input'); inp.type = type; inp.value = value;
    Object.entries(attrs).forEach(([k, v]) => inp.setAttribute(k, v));
    inp.oninput = oninput;
    w.appendChild(lab); w.appendChild(inp);
    grid.appendChild(w);
  }
  fld('Font size', 'number', L.fontSize, e => { L.fontSize = parseFloat(e.target.value) || 12; renderStage(); }, { min: 8 });
  fld('Weight (100-900)', 'number', L.fontWeight, e => { L.fontWeight = parseInt(e.target.value) || 400; renderStage(); }, { min: 100, max: 900, step: 100 });
  fld('Line height', 'number', L.lineHeight, e => { L.lineHeight = parseFloat(e.target.value) || 1; renderStage(); }, { step: 0.05 });

  const colorWrap = document.createElement('div'); colorWrap.className = 'control';
  const colorLab = document.createElement('label'); colorLab.textContent = 'Colour';
  const color = document.createElement('input'); color.type = 'color'; color.value = L.color;
  color.style.height = '28px'; color.style.padding = '0'; color.style.border = '1px solid var(--border)';
  color.oninput = (e) => { L.color = e.target.value; renderStage(); };
  colorWrap.appendChild(colorLab); colorWrap.appendChild(color);
  grid.appendChild(colorWrap);

  const fontWrap = document.createElement('div'); fontWrap.className = 'control';
  const fontLab = document.createElement('label'); fontLab.textContent = 'Font family';
  const font = document.createElement('select');
  font.style.background = '#18181b'; font.style.color = 'var(--text)';
  font.style.border = '1px solid var(--border)'; font.style.padding = '4px';
  ['Inter, Arial, sans-serif', 'Arial Black, sans-serif', 'Georgia, serif', 'Impact, sans-serif', 'Helvetica, sans-serif', 'Courier New, monospace'].forEach(f => {
    const o = document.createElement('option'); o.value = f; o.textContent = f.split(',')[0]; if (f === L.fontFamily) o.selected = true;
    font.appendChild(o);
  });
  font.onchange = (e) => { L.fontFamily = e.target.value; renderStage(); };
  fontWrap.appendChild(fontLab); fontWrap.appendChild(font);
  grid.appendChild(fontWrap);

  const alignWrap = document.createElement('div'); alignWrap.className = 'control';
  const alignLab = document.createElement('label'); alignLab.textContent = 'Align';
  const align = document.createElement('select');
  align.style.background = '#18181b'; align.style.color = 'var(--text)';
  align.style.border = '1px solid var(--border)'; align.style.padding = '4px';
  ['left', 'center', 'right'].forEach(v => {
    const o = document.createElement('option'); o.value = v; o.textContent = v; if (v === L.align) o.selected = true;
    align.appendChild(o);
  });
  align.onchange = (e) => { L.align = e.target.value; renderStage(); };
  alignWrap.appendChild(alignLab); alignWrap.appendChild(align);
  grid.appendChild(alignWrap);

  wrap.appendChild(grid);
  return wrap;
}

function fitLayer(L) {
  const a = assets[L.assetId]; if (!a) return;
  const s = Math.min(doc.w / a.width, doc.h / a.height);
  L.w = a.width * s; L.h = a.height * s;
  L.x = (doc.w - L.w) / 2; L.y = (doc.h - L.h) / 2;
  renderStage(); renderControls();
}
function fillLayer(L) {
  const a = assets[L.assetId]; if (!a) return;
  const s = Math.max(doc.w / a.width, doc.h / a.height);
  L.w = a.width * s; L.h = a.height * s;
  L.x = (doc.w - L.w) / 2; L.y = (doc.h - L.h) / 2;
  renderStage(); renderControls();
}

/* ============================================================
   File loading
   ============================================================ */
function loadImage(idx, file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const assetId = addAsset(e.target.result, img);
      doc.layers[idx].kind = 'image';
      doc.layers[idx].assetId = assetId;
      doc.layers[idx].text = '';
      autoPlaceLayer(doc, idx);
      // Apply to every other layout's same layer slot if currently empty
      Object.values(states).forEach(other => {
        if (other === doc) return;
        if (!other.layers[idx].assetId) {
          other.layers[idx].assetId = assetId;
          autoPlaceLayer(other, idx);
        }
      });
      doc.selectedIdx = idx;
      renderStage(); renderLayerList(); renderControls();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============================================================
   Export — JPEG (flatten) + PSD (layered via ag-psd)
   ============================================================ */
function rasterizeLayer(state, L) {
  const c = document.createElement('canvas');
  c.width = state.w; c.height = state.h;
  const ctx = c.getContext('2d');
  if (!L.visible) return c;

  ctx.save();
  ctx.globalAlpha = L.opacity ?? 1;
  const cx = L.x + L.w / 2, cy = L.y + L.h / 2;
  ctx.translate(cx, cy);
  ctx.rotate((L.rotation * Math.PI) / 180);

  if (L.kind === 'image') {
    const a = assets[L.assetId];
    if (!a) { ctx.restore(); return c; }
    ctx.drawImage(a.img, -L.w / 2, -L.h / 2, L.w, L.h);
  } else if (L.kind === 'text' && L.text) {
    // Word-wrap into the layer box
    ctx.translate(-L.w / 2, -L.h / 2);
    ctx.fillStyle = L.color;
    ctx.font = `${L.fontWeight} ${L.fontSize}px ${L.fontFamily}`;
    ctx.textBaseline = 'top';
    ctx.textAlign = L.align;
    const xAnchor = L.align === 'center' ? L.w / 2 : (L.align === 'right' ? L.w : 0);
    const lineHeightPx = L.fontSize * L.lineHeight;
    const lines = wrapText(ctx, L.text, L.w);
    lines.forEach((line, i) => ctx.fillText(line, xAnchor, i * lineHeightPx));
  }

  ctx.restore();
  return c;
}

function wrapText(ctx, text, maxWidth) {
  const paragraphs = text.split('\n');
  const lines = [];
  paragraphs.forEach(p => {
    if (!p) { lines.push(''); return; }
    const words = p.split(' ');
    let line = '';
    words.forEach(w => {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line); line = w;
      } else {
        line = test;
      }
    });
    if (line) lines.push(line);
  });
  return lines;
}

function hasContent(L) {
  return (L.kind === 'image' && L.assetId && assets[L.assetId]) ||
         (L.kind === 'text' && L.text);
}

function renderStateToCanvas(state) {
  const out = document.createElement('canvas');
  out.width = state.w; out.height = state.h;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, state.w, state.h);
  state.zOrder.forEach(idx => {
    const L = state.layers[idx];
    if (!hasContent(L) || !L.visible) return;
    ctx.drawImage(rasterizeLayer(state, L), 0, 0);
  });
  return out;
}

function buildPsdForState(state) {
  const base = document.createElement('canvas');
  base.width = state.w; base.height = state.h;
  const bctx = base.getContext('2d');
  bctx.fillStyle = '#000'; bctx.fillRect(0, 0, state.w, state.h);
  const psd = { width: state.w, height: state.h, children: [{ name: 'Base', canvas: base }] };
  state.zOrder.forEach(idx => {
    const L = state.layers[idx];
    if (!hasContent(L)) {
      const empty = document.createElement('canvas'); empty.width = state.w; empty.height = state.h;
      psd.children.push({ name: L.name + ' (empty)', canvas: empty });
    } else {
      psd.children.push({
        name: L.name + (L.visible ? '' : ' (hidden)'),
        canvas: rasterizeLayer(state, L),
        hidden: !L.visible,
        opacity: L.opacity ?? 1,
      });
    }
  });
  return psd;
}

function blobFromCanvas(canvas, type = 'image/jpeg', q = 0.92) {
  return new Promise(res => canvas.toBlob(b => res(b), type, q));
}

document.getElementById('exportJpg').onclick = async () => {
  const canvas = renderStateToCanvas(doc);
  const blob = await blobFromCanvas(canvas);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${currentLayout.id}.jpg`;
  a.click();
};

document.getElementById('exportPsd').onclick = () => {
  if (!window.agPsd) { alert('PSD library not loaded'); return; }
  const buffer = window.agPsd.writePsd(buildPsdForState(doc));
  const blob = new Blob([buffer], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${currentLayout.id}.psd`;
  a.click();
};

document.getElementById('exportAllJpg').onclick = async () => {
  const zip = new JSZip();
  for (const layout of LAYOUTS) {
    const state = states[layout.id];
    const canvas = renderStateToCanvas(state);
    const blob = await blobFromCanvas(canvas, 'image/jpeg', 0.92);
    zip.file(`${layout.id}.jpg`, blob);
  }
  const out = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(out);
  a.download = 'artwork-all-jpeg.zip';
  a.click();
};

document.getElementById('exportAllPsd').onclick = async () => {
  if (!window.agPsd) { alert('PSD library not loaded'); return; }
  const zip = new JSZip();
  for (const layout of LAYOUTS) {
    const state = states[layout.id];
    const buffer = window.agPsd.writePsd(buildPsdForState(state));
    zip.file(`${layout.id}.psd`, buffer);
  }
  const out = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(out);
  a.download = 'artwork-all-psd.zip';
  a.click();
};

document.getElementById('zoomFit').onclick = () => fitZoom();
document.getElementById('zoomActual').onclick = () => setZoom(1);
document.getElementById('toggleZones').onclick = (e) => {
  showSafeZones = !showSafeZones;
  e.target.classList.toggle('gold', showSafeZones);
  renderStage();
};

document.getElementById('saveProject').onclick = () => {
  // Strip non-serializable (img) and convert assets store
  const assetOut = {};
  Object.values(assets).forEach(a => {
    assetOut[a.id] = { id: a.id, src: a.src, width: a.width, height: a.height };
  });
  const out = {
    version: 1, assets: assetOut, assetSeq,
    currentLayoutId: currentLayout.id,
    states: Object.fromEntries(Object.entries(states).map(([k, s]) => [k, {
      layoutId: s.layoutId, w: s.w, h: s.h,
      layers: s.layers, zOrder: s.zOrder, selectedIdx: s.selectedIdx,
    }])),
  };
  const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'iplayer-artwork-project.json';
  a.click();
};

document.getElementById('loadProjectInput').onchange = (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.version !== 1) throw new Error('Unsupported file version');
      // Reset assets
      Object.keys(assets).forEach(k => delete assets[k]);
      assetSeq = data.assetSeq || 1;
      const pending = [];
      Object.values(data.assets || {}).forEach(a => {
        const img = new Image();
        const p = new Promise(res => {
          img.onload = () => { assets[a.id] = { id: a.id, src: a.src, img, width: a.width, height: a.height }; res(); };
        });
        img.src = a.src;
        pending.push(p);
      });
      Promise.all(pending).then(() => {
        Object.keys(states).forEach(k => delete states[k]);
        Object.entries(data.states).forEach(([k, s]) => { states[k] = s; });
        currentLayout = LAYOUTS.find(l => l.id === data.currentLayoutId) || LAYOUTS[0];
        doc = states[currentLayout.id];
        document.querySelectorAll('.layout-btn').forEach(b => b.classList.toggle('active', b.dataset.id === currentLayout.id));
        buildStage();
      });
    } catch (err) { alert('Failed to load project: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = ''; // reset so same file can re-load
};
window.addEventListener('resize', () => fitZoom());

/* Keyboard nudge for selected layer. Arrow = 1px, Shift+Arrow = 10px */
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const L = doc.layers[doc.selectedIdx];
  if (!L || !hasContent(L)) return;
  const step = e.shiftKey ? 10 : 1;
  let handled = true;
  switch (e.key) {
    case 'ArrowLeft':  L.x -= step; break;
    case 'ArrowRight': L.x += step; break;
    case 'ArrowUp':    L.y -= step; break;
    case 'ArrowDown':  L.y += step; break;
    default: handled = false;
  }
  if (handled) {
    e.preventDefault();
    L.touched = true;
    syncLayerProportionally(doc.layoutId, doc.selectedIdx);
    renderStage(); renderControls();
  }
});

/* ============================================================
   Boot
   ============================================================ */
loadStrandState(currentStrandId);
applyBrandAssetsToEmptySlots();
renderStrandPicker();
renderBrandPalette();
renderLayoutButtons();
buildStage();

// Deselect when clicking empty stage
stageEl.addEventListener('pointerdown', () => {
  doc.selectedIdx = -1; renderStage(); renderLayerList(); renderControls();
});
</script>
